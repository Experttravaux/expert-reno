<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#1A1815"/>
  <!-- Anneau façon « enso » (ouvert), inspiré du logo -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#B4894E" stroke-width="4.5"
          stroke-linecap="round" stroke-dasharray="116 30" transform="rotate(125 32 32)"/>
  <!-- Monogramme E (vert clair) + R (vert foncé) -->
  <text x="17" y="42" font-family="Georgia, 'DejaVu Serif', serif" font-size="28" font-weight="700" fill="#B4894E">E</text>
  <text x="31" y="44" font-family="Georgia, 'DejaVu Serif', serif" font-size="30" font-weight="700" fill="#F7F4EF">R</text>
</svg>
