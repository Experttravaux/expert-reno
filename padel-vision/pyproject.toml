[project]
name = "padelvision"
version = "0.1.0"
description = "Analyse vidéo de parties de padel avec une borne au bord du terrain"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "segno>=1.6",
]

[project.optional-dependencies]
video = ["opencv-python>=4.9", "ultralytics>=8.3"]
stripe = ["stripe>=10.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["padelvision"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
