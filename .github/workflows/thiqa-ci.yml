name: Thiqa CI

on:
  push:
    branches: [main]
    paths: ['thiqa/**', '.github/workflows/thiqa-ci.yml']
  pull_request:
    paths: ['thiqa/**', '.github/workflows/thiqa-ci.yml']

concurrency:
  group: thiqa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: thiqa

jobs:
  checks:
    name: Lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: thiqa/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: thiqa/.nvmrc
          cache: pnpm
          cache-dependency-path: thiqa/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Includes the 100 % coverage gate on state machine & scoring, and the
      # SQL ↔ core sync tests (enums, transitions, generated seed).
      - run: pnpm test

  database:
    name: Migrations · RLS · SLA (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start Supabase (applies migrations + seeds)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: SQL tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: ./packages/db/scripts/test-sql.sh
      - name: Lint database functions
        run: supabase db lint --level error --fail-on error
      - name: Generate DB types
        run: supabase gen types typescript --local --schema public > packages/db/src/database.types.ts
      - uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: thiqa/packages/db/src/database.types.ts

  deploy-db:
    name: Push migrations to Supabase
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, database]
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Skip when Supabase secrets are not configured
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase secrets missing — skipping deploy."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - if: steps.guard.outputs.skip != 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      # Reference data (idempotent). seed.dev.sql is never applied outside local.
      - if: steps.guard.outputs.skip != 'true' && env.SUPABASE_DB_URL != ''
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed.sql
